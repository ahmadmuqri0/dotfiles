[accessibility]
ui_scale = 1.0500000081956387

[bar]
order = ["default"]

[bar.default]
background_opacity = 0.89999997988343239
capsule = true
capsule_radius = 8
center = ["group:g1"]
concave_edge_corners = true
end = [
  "tray",
  "notifications",
  "clipboard",
  "volume",
  "network",
  "bluetooth",
  "battery",
  "group:g2",
  "session",
]
font_family = "Google Sans Medium"
margin_ends = 0
radius = 0
radius_bottom_left = 5
radius_bottom_right = 5
scale = 1.0000000074505806
shadow = false
start = ["launcher", "workspaces", "media"]

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_container"
id = "g1"
members = ["weather", "clock"]
opacity = 1.0
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_container"
id = "g2"
members = ["cpu", "ram", "temp"]
opacity = 1.0
padding = 6.0
radius = 8.0

[calendar]
enabled = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@eDP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_media_controls = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[osd]
background_opacity = 0.89999997988343239

[shell]
avatar_path = "/home/muqri/.face.jpg"
font_family = "Google Sans Medium"
panel_anchor_bar = "default"
polkit_agent = true
umbriel_audio_provider_enabled = true

[shell.greeter_sync]
auto_sync = true

[shell.panel]
session_placement = "floating"
session_position = "center"
transparency_mode = "glass"

[theme]
builtin = "Catppuccin"
community_palette = "Tokyo Night Moon"
custom_palette = "halcyon"
mode = "dark"
source = "custom"
wallpaper_scheme = "muted"

[theme.templates]
builtin_ids = ["gtk3", "gtk4", "umbriel", "kitty"]

[wallpaper.default]
path = "/home/muqri/Pictures/Wallpapers/astronaut.jpg"

[wallpaper.last]
path = "/home/muqri/Pictures/Wallpapers/astronaut.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/muqri/Pictures/Wallpapers/astronaut.jpg"

[widget.battery]
display_mode = "glyph"
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%a %d, %H:%M}"

[widget.cpu]
show_value = false

[widget.launcher]
custom_image = "/home/muqri/Pictures/cachyos.png"
glyph = "cachyos"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.ram]
show_value = false

[widget.temp]
show_value = false

[widget.volume]
show_label = true

[widget.weather]
show_condition = false

[widget.workspaces]
pill_scale = 0.80000000000000004
show_labels = false
style = "regular"
