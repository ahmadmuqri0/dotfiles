########## Options ##########

# General
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on                   # enable mouse support
set -g set-clipboard on           # use system clipboard
set -g detach-on-destroy off      # don't exit from tmux when closing a session
set -g escape-time 0              # remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000      # increase history size (from 2,000)
set -g status-interval 3          # update the status bar every 3 seconds

# Start number at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vim style copying
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

########## Keybindings ##########

# Rebind prefix to ctrl+space
unbind C-b
set -g prefix C-space
bind-key C-space send-prefix

# Split windows
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
unbind r
bind r source-file $HOME/.tmux.conf

# Shift+arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

########## Theme ##########

# Ayu Mirage theme colors
thm_bg="#1f2430"
thm_fg="#cccac2"
thm_cyan="#95e6cb"
thm_black="#171b24"
thm_gray="#242936"
thm_magenta="#dfbfff"
thm_pink="#f28779"
thm_red="#f28779"
thm_green="#d5ff80"
thm_yellow="#ffcc66"
thm_blue="#73d0ff"
thm_orange="#ffad66"
thm_black4="#707a8c"

# Status bar
set -g status "on"
set -g status-left-length 100
set -g status-style "fg=${thm_fg}, bg=default"
set -g status-left "#[fg=${thm_blue}, bold] #S #[fg=${thm_fg}, nobold]|"
set -g status-right "#[fg=${thm_orange}]#h | #[fg=${thm_yellow},bold]%d %b, %H:%M "
set -g window-status-current-format "#[fg=${thm_green},bold]#[nounderscore] #[underscore] #I:#W#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format " #I:#W"

# Messages
set -g message-style "fg=${thm_fg},bg=default,align=centre"
set -g message-command-style "align=centre"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"
